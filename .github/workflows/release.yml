name: CI and release

# Every push and PR runs the tests. A push to main whose package.json version isn't on npm yet
# also publishes it, then tags the commit and creates a GitHub release from the CHANGELOG.
# Pushes that don't bump the version only run the tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22] # the oldest supported version (engines) and the current LTS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci --prefix installer
      - run: npm run typecheck --prefix installer
      - run: npm test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release # never two publishes at once
    permissions:
      contents: write # tag and GitHub release
      id-token: write # npm Trusted Publishing (OIDC), no stored token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Is this version new?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          kit=$(node -p "require('./installer/kit.manifest.json').kitVersion")
          if [ "$version" != "$kit" ]; then
            echo "::error::package.json is $version but kitVersion is $kit; bump both together."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "agent-engineering-kit@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing needs npm >= 11.5.1.
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest

      - if: steps.version.outputs.publish == 'true'
        run: npm ci --prefix installer

      # prepublishOnly rebuilds dist/, regenerates the docs and runs the tests before uploading.
      - if: steps.version.outputs.publish == 'true'
        name: Publish to npm
        run: npm publish

      - if: steps.version.outputs.publish == 'true'
        name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v " " {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
