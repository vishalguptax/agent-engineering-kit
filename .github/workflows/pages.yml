name: Deploy site to GitHub Pages

# Builds site/ (live numbers, generated pages, Open Graph images) and deploys it. The built files exist only in
# the deployed artifact; nothing is committed back. The schedule refreshes the live numbers without a site edit.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - "scripts/site-content.json"
      - ".github/workflows/pages.yml"
      # The build reads these, so a change to them changes the site too.
      - "CHANGELOG.md"
      - "kit/**"
      - "installer/kit.manifest.json"
      - "installer/dist/**"
      - "package.json"
      - "scripts/live-numbers.json"
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: read

# One deployment at a time; don't cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The build runs repo code with network access, so it gets read-only rights; only deploy can write to Pages.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site (live numbers, generated pages, images)
        run: node scripts/build-site.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow tells Bing, Yandex and other participating engines which pages changed. The key is public by
      # design: site/<key>.txt proves the site owns it. Only on pushes, not the 12-hour number refresh.
      - name: Tell search engines (IndexNow)
        if: github.event_name == 'push'
        env:
          INDEXNOW_KEY: 79c2001290f5ea7fb79977088a7dfa3a
          SITE: https://agentengineeringkit.vishalg.in
        run: |
          urls=$(curl -sf "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          body=$(jq -nc --arg key "$INDEXNOW_KEY" --arg loc "$SITE/$INDEXNOW_KEY.txt" --argjson urls "$urls" '{host: "agentengineeringkit.vishalg.in", key: $key, keyLocation: $loc, urlList: $urls}')
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow answered $status"
          case "$status" in 200|202) ;; *) echo "::warning title=IndexNow::the ping answered $status";; esac
